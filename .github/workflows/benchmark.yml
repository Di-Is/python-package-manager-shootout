# DO NOT EDIT MANUALLY
# This file is generated by ./bin/build_workflow.sh
---
name: benchmark
on:
  push:

jobs:
  modern-benchmark:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        tool: ["uv", "poetry", "pdm"]
        method: ["introduce", "lock", "install", "update", "add"]
        cache: ["cache", "no-cache"]
        exclude:
          - method: introduce
            cache: cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: install hyperfine
        run: |
          wget https://github.com/sharkdp/hyperfine/releases/download/v1.19.0/hyperfine_1.19.0_amd64.deb
          sudo dpkg -i hyperfine_1.19.0_amd64.deb

      - name: install uv
        uses: astral-sh/setup-uv@v4

      - name: benchmark
        run: |
          uv run benchmark.py --tool ${{ matrix.tool }} --method ${{ matrix.method }} --${{ matrix.cache }}
          mkdir ${{ matrix.tool }}-${{ matrix.method }}-${{ matrix.cache }}
          mv stats.csv ${{ matrix.tool }}-${{ matrix.method }}-${{ matrix.cache }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-${{ matrix.method }}-${{ matrix.cache }}-stats
          path: ${{ matrix.tool }}-${{ matrix.method }}-${{ matrix.cache }}
          retention-days: 10
  
  aggregate-csv:
    needs: modern-benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Download all CSV artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Combine CSV files
        run: |
          CSV_FILES=$(ls artifacts/*/*.csv)
          HEADER=$(head -n 1 $(echo $CSV_FILES | awk '{print $1}'))
          echo $HEADER > combined.csv

          for FILE in $CSV_FILES; do
            tail -n +2 $FILE >> combined.csv
          done

      - name: Read CSV
        id: csv
        uses: juliangruber/read-file-action@v1
        with:
          path: ./combined.csv

      - name: Create MD
        uses: petems/csv-to-md-table-action@master
        id: csv-table-output
        with:
          csvinput: ${{ steps.csv.outputs.content }}

