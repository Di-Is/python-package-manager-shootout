  uv:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: setup
        run: ./bin/actions_prereqs.sh
      
      - name: install tool
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: tooling
        run: |
          cd uv
          hyperfine --runs 5 --export-csv ../timings/tooling.csv \
            --show-output \
            --conclude 'uv pip uninstall uv' \
            'uv pip install --no-cache uv'
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: import
        run: |
          cd uv  
          uv add --frozen -r ../requirements.txt

      - name: lock cold
        run: |
          cd uv
          hyperfine --runs 5 --export-csv ../timings/lock-cold.csv \
            --show-output \
            --setup 'uv cache clean' \
            --conclude 'rm uv.lock' \
            'uv lock --no-cache'
  
      - name: lock warm
        run: |
          cd uv
          hyperfine --runs 5 --warmup 1 --export-csv ../timings/lock-warm.csv \
            --show-output \
            --setup 'uv cache clean' \
            --conclude 'rm uv.lock' \
            'uv lock'

      - name: install cold
        run: |
          cd uv
          hyperfine --runs 5 --export-csv ../timings/install-cold.csv \
            --show-output \
            --setup 'uv lock && uv cache clean' \
            --conclude 'rm -r .venv' \
            'uv sync --no-cache'

      - name: install warm
        run: |
          cd uv
          hyperfine --runs 5 --warmup 1 --export-csv ../timings/install-warm.csv \
            --show-output \
            --conclude 'rm -r .venv' \
            'uv sync'
    
      - name: update cold
        run: |
          cd uv
          hyperfine --runs 5 --export-csv ../timings/update-cold.csv \
            --show-output \
            --setup 'uv sync && uv cache clean' \
            'uv sync --upgrade --no-cache'

      - name: update warm
        run: |
          cd uv
          hyperfine --runs 5 --warmup 1 --export-csv ../timings/update-cold.csv \
            --show-output \
            --setup 'uv cache clean' \
            'uv sync --upgrade'

      - name: add package
        run: |
          cd uv
          hyperfine --runs 5 --export-csv ../timings/add-package.csv \
            --show-output \
            --setup 'uv cache clean' \
            --prepare 'uv sync --no-cache' \
            --conclude 'uv remove ${ADD_PACKAGE} && rm -r .venv uv.lock' \
            'uv add ${ADD_PACKAGE} --no-cache'

      - name: stats
        run: |
          VERSION=`uv --version | awk '{print $2}'`
          CSV=uv/stats.csv
          TIMESTAMP=$(date +%s)
          mkdir -p "uv"
          echo "tool,version,mean,median,stddiv,min,max" > "$CSV"
          for stat in "tooling" "import" "lock-cold" "lock-warm" "install-cold" "install-warm" "update-cold" "update-warm" "add-package"; do
            # Extract the necessary fields from the timings CSV
            mean=$(awk -F',' 'NR==2 {print $2}' timings/$stat.csv)
            median=$(awk -F',' 'NR==2 {print $4}' timings/$stat.csv)
            stddiv=$(awk -F',' 'NR==2 {print $3}' timings/$stat.csv)
            min=$(awk -F',' 'NR==2 {print $7}' timings/$stat.csv)
            max=$(awk -F',' 'NR==2 {print $8}' timings/$stat.csv)
            
            # Append the formatted data to the stats CSV
            echo "uv,$VERSION,$mean,$median,$stddiv,$min,$max" >> "$CSV"
          done
          csv2md "$CSV" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: uv-stats
          path: uv/stats.csv
          retention-days: 10

  gather:
    runs-on: ubuntu-22.04
    needs: [poetry, pdm, uv]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
      - name: build stats.csv
        run: |
          # join and remove duplicate headers
          cat *-stats/stats.csv > raw.csv
          HEADER=$(head -n 1 raw.csv)
          echo "$HEADER" > stats.csv
          grep -v "$HEADER" raw.csv >> stats.csv
      - uses: actions/upload-artifact@v4
        with:
          name: stats
          path: stats.csv
          retention-days: 10
