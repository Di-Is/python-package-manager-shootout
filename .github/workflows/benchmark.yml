# DO NOT EDIT MANUALLY
# This file is generated by ./bin/build_workflow.sh
---
name: benchmark
on:
  push:

env:
  ADD_PACKAGE: goodconf
  UV_PYTHON_PREFERENCE: only-system
  UV_PRERELEASE: allow

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        tools: 
          - name: uv
            install-tool: curl -LsSf https://astral.sh/uv/install.sh | sh
            clean-tool: uv cache clean && rm ~/.local/bin/uv ~/.local/bin/uvx 
            clean-cache: uv cache clean
            clean-venv: rm -rf .venv
            clean-lock: rm -rf uv.lock
            import: uv add --frozen -r ../requirements.txt
            lock: uv lock
            sync: uv sync
            update: uv sync --upgrade
            add: uv add
            backup: cp uv.lock uv.lock.bak && cp pyproject.toml pyproject.toml.bak
            roleback: cp uv.lock.bak uv.lock && cp pyproject.toml.bak pyproject.toml
            version: uv --version | awk '{print $2}'
    defaults:
      run:
        working-directory: ./${{ matrix.tools.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: setup
        run: ../bin/actions_prereqs.sh
      
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: install tool
        run: |
          hyperfine --runs 5 --export-csv tooling.csv \
            --show-output \
            --conclude '${{ matrix.tools.clean-tool }}' \
            '${{ matrix.tools.install-tool }}'

      - name: import
        run: ${{ matrix.tools.import }}

      - name: lock cold
        run: |
          hyperfine --runs 5 --export-csv lock-cold.csv \
            --show-output \
            --prepare '${{ matrix.tools.clean-cache }}' \
            --conclude '${{ matrix.tools.clean-lock }}' \
            '${{ matrix.tools.lock }}'
  
      - name: lock warm
        run: |
          hyperfine --runs 5 --warmup 1 --export-csv lock-warm.csv \
            --show-output \
            --conclude '${{ matrix.tools.clean-lock }}' \
            '${{ matrix.tools.lock }}'

      - name: install cold
        run: |
          hyperfine --runs 5 --export-csv install-cold.csv \
            --show-output \
            --setup '${{ matrix.tools.lock }}' \
            --prepare '${{ matrix.tools.clean-cache }}' \
            --conclude '${{ matrix.tools.clean-venv }}' \
            '${{ matrix.tools.sync }}'

      - name: install warm
        run: |
          hyperfine --runs 5 --warmup 1 --export-csv install-warm.csv \
            --show-output \
            --setup '${{ matrix.tools.lock }}' \
            --conclude '${{ matrix.tools.clean-venv }}' \
            '${{ matrix.tools.sync }}'
    
      - name: update cold
        run: |
          hyperfine --runs 5 --export-csv update-cold.csv \
            --show-output \
            --setup '${{ matrix.tools.sync }}' \
            --prepare '${{ matrix.tools.clean-cache }}' \
            '${{ matrix.tools.update }}'

      - name: update warm
        run: |
          hyperfine --runs 5 --warmup 1 --export-csv update-warm.csv \
            --show-output \
            --setup '${{ matrix.tools.sync }}' \
            '${{ matrix.tools.update }}'

      - name: add package
        run: |
          hyperfine --runs 5 --export-csv add-package.csv \
            --show-output \
            --setup '${{ matrix.tools.backup }}' \
            --prepare '${{ matrix.tools.clean-cache }} && ${{ matrix.tools.sync }}' \
            --conclude '${{ matrix.tools.roleback }} && ${{ matrix.tools.clean-venv }}' \
            '${{ matrix.tools.add }} ${ADD_PACKAGE}'

      - name: stats
        run: |
          VERSION=`${{ matrix.tools.version }}`
          CSV=stats.csv
          TIMESTAMP=$(date +%s)
          echo "tool,version,stat,mean,median,stddiv,min,max" > "$CSV"
          for stat in "tooling" "lock-cold" "lock-warm" "install-cold" "install-warm" "update-cold" "update-warm" "add-package"; do
            # Extract the necessary fields from the timings CSV
            mean=$(awk -F',' 'NR==2 {printf "%.2f", $2}' $stat.csv)
            median=$(awk -F',' 'NR==2 {printf "%.2f", $4}' $stat.csv)
            stddiv=$(awk -F',' 'NR==2 {printf "%.2f", $3}' $stat.csv)
            min=$(awk -F',' 'NR==2 {printf "%.2f", $7}' $stat.csv)
            max=$(awk -F',' 'NR==2 {printf "%.2f", $8}' $stat.csv)
            
            # Append the formatted data to the stats CSV
            echo "${{ matrix.tools.name }},$VERSION,$stat,$mean,$median,$stddiv,$min,$max" >> "$CSV"
          done
          csv2md "$CSV" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: ${{ matrix.tools.name }}-stats
          path: stats.csv
          retention-days: 10
