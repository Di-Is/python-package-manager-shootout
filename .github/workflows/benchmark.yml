# DO NOT EDIT MANUALLY
# This file is generated by ./bin/build_workflow.sh
---
name: benchmark
on:
  push:

env:
  ADD_PACKAGE: goodconf

jobs:
  pip:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
  
      - name: setup
        run: ./bin/actions_prereqs.sh
  
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: cold install
        run: |
          hyperfine --runs 5 --export-csv timings/install-cold.csv \
            --show-output \
            --prepare 'uv venv && uv pip install pip' \
            --conclude 'rm -r .venv && pip cache purge' \
            '.venv/bin/pip install -r requirements.txt'
  
      - name: warm install
        run: |
          hyperfine --runs 5 --warmup 1 --export-csv timings/install-warm.csv \
            --show-output \
            --prepare 'uv venv && uv pip install pip' \
            --conclude 'rm -r .venv' \
            '.venv/bin/pip install -r requirements.txt'

      - name: stats
        run: |
          VERSION=`uv venv && uv pip install pip && pip --version | grep -oP 'pip \K[\d.]+'`
          CSV=pip/stats.csv
          TIMESTAMP=$(date +%s)
          mkdir -p "pip"
          echo "tool,version,stat,mean,median,stddiv,min,max" > "$CSV"
          for stat in "install-cold" "install-warm"; do
            # Extract the necessary fields from the timings CSV
            mean=$(awk -F',' 'NR==2 {printf "%.2f", $2}' timings/$stat.csv)
            median=$(awk -F',' 'NR==2 {printf "%.2f", $4}' timings/$stat.csv)
            stddiv=$(awk -F',' 'NR==2 {printf "%.2f", $3}' timings/$stat.csv)
            min=$(awk -F',' 'NR==2 {printf "%.2f", $7}' timings/$stat.csv)
            max=$(awk -F',' 'NR==2 {printf "%.2f", $8}' timings/$stat.csv)
            # Append the formatted data to the stats CSV
            echo "pip,$VERSION,$stat,$mean,$median,$stddiv,$min,$max" >> "$CSV"
          done
          csv2md "$CSV" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: pip-stats
          path: pip/stats.csv
          retention-days: 10

  
  poetry:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: setup
        run: ./bin/actions_prereqs.sh

      - name: tooling
        run: |
          cd poetry
          hyperfine --runs 5 --export-csv ../timings/tooling.csv \
            --show-output \
            --prepare 'uv venv' \
            --conclude 'rm -r .venv' \
            'uv pip install --no-cache poetry'

      - name: install poetry
        run: uv pip install poetry
        env:
          UV_SYSTEM_PYTHON: "1"

      - name: import
        run: |
          cd poetry  
          poetry add --allow-prereleases $(sed -e 's/#.*//' -e '/^$$/ d' < ../requirements.txt)

      - name: lock cold
        run: |
            cd poetry
            hyperfine --runs 5 --export-csv ../timings/lock-cold.csv \
              --show-output \
              --setup 'rm -rf ~/.cache/pypoetry' \
              --conclude 'rm poetry.lock && poetry env remove --all || true' \
              'poetry lock --no-cache'
    
      - name: lock warm
        run: |
          cd poetry
          hyperfine --runs 5 --warmup 1 --export-csv ../timings/lock-warm.csv \
            --show-output \
            --setup 'rm -rf ~/.cache/pypoetry' \
            --conclude 'rm poetry.lock && poetry env remove --all || true' \
            'poetry lock'

      - name: install cold
        run: |
          cd poetry
          hyperfine --runs 5 --export-csv ../timings/install-cold.csv \
            --show-output \
            --setup 'poetry lock' \
            --prepare 'rm -rf ~/.cache/pypoetry' \
            --conclude 'poetry env remove --all || true' \
            'poetry install'
    
      - name: install warm
        run: |
          cd poetry
          hyperfine --runs 5 --warmup 1 --export-csv ../timings/install-warm.csv \
            --show-output \
            --conclude 'poetry env remove --all || true' \
            'poetry install'

      - name: update cold
        run: |
          cd poetry
          hyperfine --runs 5 --export-csv ../timings/update-cold.csv \
            --show-output \
            --setup 'poetry install' \
            --prepare 'rm -rf ~/.cache/pypoetry' \
            'poetry update --no-cache'
    
      - name: update warm
        run: |
          cd poetry
          hyperfine --runs 5 --warmup 1 --export-csv ../timings/update-warm.csv \
            --show-output \
            --setup 'poetry install' \
            'poetry update'

      - name: add package
        run: |
          cd poetry
          hyperfine --runs 5 --export-csv ../timings/add-package.csv \
            --show-output \
            --setup 'rm -rf ~/.cache/pypoetry && cp poetry.lock poetry.lock.bak && cp pyproject.toml pyproject.toml.bak' \
            --prepare 'rm -rf ~/.cache/pypoetry && poetry install' \
            --conclude 'poetry env remove --all && cp poetry.lock.bak poetry.lock && cp pyproject.toml.bak pyproject.toml' \
            'poetry add ${ADD_PACKAGE} --no-cache'

      - name: stats
        run: |
          VERSION=`poetry --version | awk '{print $3}' | tr -d ')'`
          CSV=poetry/stats.csv
          TIMESTAMP=$(date +%s)
          mkdir -p "poetry"
          echo "tool,version,stat,mean,median,stddiv,min,max" > "$CSV"
          for stat in "tooling" "lock-cold" "lock-warm" "install-cold" "install-warm" "update-cold" "update-warm" "add-package"; do
            # Extract the necessary fields from the timings CSV
            mean=$(awk -F',' 'NR==2 {printf "%.2f", $2}' timings/$stat.csv)
            median=$(awk -F',' 'NR==2 {printf "%.2f", $4}' timings/$stat.csv)
            stddiv=$(awk -F',' 'NR==2 {printf "%.2f", $3}' timings/$stat.csv)
            min=$(awk -F',' 'NR==2 {printf "%.2f", $7}' timings/$stat.csv)
            max=$(awk -F',' 'NR==2 {printf "%.2f", $8}' timings/$stat.csv)
            
            # Append the formatted data to the stats CSV
            echo "poetry,$VERSION,$stat,$mean,$median,$stddiv,$min,$max" >> "$CSV"
          done
          csv2md "$CSV" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: poetry-stats
          path: poetry/stats.csv
          retention-days: 10

